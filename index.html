<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROBO STRIKE — Retro Tank Casino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- OFL fonts: Press Start 2P + VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #000; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'VT323', monospace;
        /* Outside background: blurred arcade hall CC0 — pxhere */
        background: #000 url('/assets/arcade/bg_outside_blur.jpg') center/cover no-repeat;
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        pointer-events: none;
      }
      /* Arcade wrapper — no cabinet picture, gameplay border takes the space */
      .arcade-wrap {
        position: relative;
        width: min(96vw, 900px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        padding: 18px 18px 12px;
        box-shadow: 0 16px 48px rgba(0,0,0,0.75);
        border: 2px solid #1a1a1a;
        border-radius: 10px;
      }
      .arcade-screen {
        position: relative;
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        max-height: 78vh;
        image-rendering: pixelated;
        overflow: hidden;
        /* Gameplay border now takes the cabinet space — bigger */
        border: 6px solid #1a1a1a;
        outline: 2px solid #3a3a4f;
        outline-offset: 3px;
        box-shadow: 0 0 0 3px #000, 0 0 32px rgba(79,242,227,0.3), inset 0 0 20px rgba(0,0,0,0.4);
        border-radius: 6px;
        background: #0a1a3f;
      }
      #game {
        width: 100% !important;
        height: 100% !important;
        aspect-ratio: 4 / 3;
      }
      #game canvas {
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated !important;
      }
      /* CRT scanline + vignette overlay */
      .scanline {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.06) 0px,
          rgba(255,255,255,0.06) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
        pointer-events: none;
      }
      #game { width: 320px; height: 240px; display: block; }
      /* Top marquee for ROBO STRIKE name — now above gameplay, not over cabinet */
      .marquee {
        font-family: 'Press Start 2P', monospace;
        font-size: 13px;
        color: #ffd94f;
        text-shadow: 0 2px 0 #1a1a1a, 0 0 10px rgba(255,217,79,0.7);
        letter-spacing: 2px;
        margin-bottom: 12px;
        white-space: nowrap;
      }
    </style>
    <script async src="https://jam.chain.wtf/widget.js"></script>
  </head>
  <body>
    <div class="arcade-wrap">
      <div class="marquee">ROBO STRIKE</div>
      <div class="arcade-screen">
        <div id="game"></div>
        <div class="scanline"></div>
        <div class="vignette"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
