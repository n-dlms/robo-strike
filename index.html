<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROBO STRIKE — Retro Tank Casino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- OFL fonts: Press Start 2P + VT323 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #000; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'VT323', monospace;
        /* Outside background: PIXABAY 3D CC0 — as named */
        background: #000 url('/assets/arcade/pixabay_arcade_machine_3d.png') center/cover no-repeat;
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        pointer-events: none;
      }
      /* Arcade border wrapper: BIGGER medium — not small, not fullscreen — 484/258 ratio from OGA arcade_gui_sheet */
      .arcade-wrap {
        position: relative;
        width: min(96vw, 1150px);
        aspect-ratio: 484 / 258;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      }
      .arcade-border {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .arcade-screen {
        position: relative;
        width: 400px;
        height: 225px;
        image-rendering: pixelated;
        overflow: hidden;
        /* Extended border: thicker, arcade bezel */
        border: 3px solid #1a1a1a;
        outline: 1px solid #2a2a2f;
        outline-offset: 2px;
        box-shadow: 0 0 0 2px #000, 0 0 24px rgba(79,242,227,0.25), 0 8px 24px rgba(0,0,0,0.6);
        border-radius: 4px;
      }
      #game canvas {
        width: 400px !important;
        height: 225px !important;
        image-rendering: pixelated !important;
      }
      /* CRT scanline + vignette overlay */
      .scanline {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.06) 0px,
          rgba(255,255,255,0.06) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
        pointer-events: none;
      }
      #game { width: 320px; height: 180px; display: block; }
      /* Top marquee for ROBO STRIKE name */
      .marquee {
        position: absolute;
        top: 4%;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Press Start 2P', monospace;
        font-size: 10px;
        color: #ffd94f;
        text-shadow: 0 1px 0 #1a1a1a, 0 0 6px rgba(255,217,79,0.6);
        letter-spacing: 1px;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
    <script async src="https://jam.chain.wtf/widget.js"></script>
  </head>
  <body>
    <div class="arcade-wrap">
      <!-- Border: OGA arcade_gui_sheet CC0 484x258 fallback, realistic arcade surrounds -->
      <img class="arcade-border" src="/assets/arcade/oga_arcade_gui_sheet.png" alt="arcade cabinet border" onerror="this.style.display='none'" />
      <div class="marquee">ROBO STRIKE</div>
      <div class="arcade-screen">
        <div id="game"></div>
        <div class="scanline"></div>
        <div class="vignette"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
